<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japonsko guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Figtree:wght@400;500;600;700;800&display=swap">
<meta name="theme-color" content="#d7263d">
<meta name="description" content="Moje tipy z Japonska s linkami do Google Maps.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japonsko">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}
/* Layout: jedna mobilna appka, spodna navigacia ako vo vlaku; trasy kreslene ako linky metra, miesta maju "stanicne kody" (SH-03) */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1b1d22; --muted:#6a6e78; --line:#e2dfd7;
  --red:#d7263d; --red-soft:#fbe4e6; --chip:#eceae3; --gold:#b8860b;
  --tokyo:#2f9e44; --kyoto:#7b4fd6; --osaka:#e8590c; --nara:#1c7ed6; --kamakura:#0b8a8a;
  --vylety:#5c7cfa; --alpy:#2b8a3e; --kansai:#c2255c; --nikko:#a61e4d; --fuji:#1971c2; --kyushu:#e67700; --okinawa:#0c8599; --hokkaido:#495057; --zapad:#862e9c;
  --shadow:0 1px 2px rgba(27,29,34,.06),0 4px 14px rgba(27,29,34,.06);
  --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121317; --surface:#1c1e24; --ink:#eceae4; --muted:#9a9ea8; --line:#2c2f37;
  --red:#ff5468; --red-soft:#3a1d22; --chip:#262931; --gold:#e0b343;
  --tokyo:#51cf66; --kyoto:#a98bff; --osaka:#ff922b; --nara:#4dabf7; --kamakura:#38d9a9;
  --vylety:#91a7ff; --alpy:#69db7c; --kansai:#f783ac; --nikko:#f06595; --fuji:#74c0fc; --kyushu:#ffc078; --okinawa:#66d9e8; --hokkaido:#adb5bd; --zapad:#da77f2;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121317; --surface:#1c1e24; --ink:#eceae4; --muted:#9a9ea8; --line:#2c2f37;
  --red:#ff5468; --red-soft:#3a1d22; --chip:#262931; --gold:#e0b343;
  --tokyo:#51cf66; --kyoto:#a98bff; --osaka:#ff922b; --nara:#4dabf7; --kamakura:#38d9a9;
  --vylety:#91a7ff; --alpy:#69db7c; --kansai:#f783ac; --nikko:#f06595; --fuji:#74c0fc; --kyushu:#ffc078; --okinawa:#66d9e8; --hokkaido:#adb5bd; --zapad:#da77f2;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

/* hlavicka */
.hero{padding-block:22px 6px;display:flex;flex-direction:column;gap:6px}
.hero .kanji{font-family:var(--display);color:var(--red);font-size:13px;letter-spacing:.3em}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1.05;margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}

/* mesta */
.cities{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.cities::-webkit-scrollbar{display:none}
.city{flex:0 0 auto;border:0;background:var(--chip);border-radius:999px;padding:8px 14px 8px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:14px}
.city .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:11px;background:var(--c)}
.city[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.city .n{font-weight:500;opacity:.6;font-size:12px}

/* filtre */
.filters{display:flex;flex-direction:column;gap:8px;padding-block:4px 12px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.area{border-left:4px solid var(--c)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink)}
.near{border:0;background:var(--red);color:#fff;border-radius:12px;padding:0 14px;font-weight:700;cursor:pointer;white-space:nowrap}

/* sekcie */
.areahead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.areahead .code{font-family:var(--display);color:#fff;background:var(--c);border-radius:6px;padding:2px 7px;font-size:13px}
.areahead h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.areahead .cnt{color:var(--muted);font-size:13px;margin-left:auto}
.list{display:flex;flex-direction:column;gap:10px}

/* karta miesta */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:80px}
.card.flash{outline:3px solid var(--red);outline-offset:2px}
.top{display:flex;gap:12px;align-items:flex-start}
.emo{flex:0 0 44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:22px}
.ttl{flex:1;min-width:0}
.ttl h3{margin:0;font-size:16.5px;line-height:1.25;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.st{font-family:var(--display);font-size:11px;color:var(--c);border:1.5px solid var(--c);border-radius:5px;padding:0 5px;line-height:17px}
.tag{background:var(--chip);border-radius:6px;padding:1px 7px;font-weight:600;color:var(--ink)}
.tag.must{background:var(--red);color:#fff}
.tag.gem{background:var(--gold);color:#fff}
.dist{font-weight:700;color:var(--red)}
.note{margin:0;font-size:15px;line-height:1.55;padding-left:12px;border-left:3px solid var(--line);max-width:65ch}
.route-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--c);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;text-decoration:none;border:0;cursor:pointer}
.btn.maps{flex:1;min-width:0;white-space:nowrap;background:var(--ink);color:var(--bg)}
.btn.tog{background:var(--chip);min-width:46px}
.btn.photo{background:var(--chip);color:var(--ink);white-space:nowrap}
.btn.tog[aria-pressed="true"].want{background:var(--gold);color:#fff}
.btn.tog[aria-pressed="true"].done{background:var(--tokyo);color:#fff}
.card.isdone{opacity:.62}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

/* trasy */
.routes{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.route{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.route header{display:flex;flex-direction:column;gap:4px}
.route .rt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.route .rt .line{font-family:var(--display);font-size:12px;color:#fff;background:var(--c);border-radius:999px;padding:2px 9px}
.route h3{margin:0;font-size:19px;font-weight:800;text-wrap:balance}
.route .why{margin:0;color:var(--muted);font-size:14px}
.stops{list-style:none;margin:0;padding:0;position:relative}
.stops li{position:relative;padding:0 0 14px 30px;min-height:28px}
.stops li::before{content:"";position:absolute;left:9px;top:12px;bottom:-4px;width:4px;background:var(--c)}
.stops li:last-child::before{display:none}
.stops li .bub{position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:4px solid var(--c)}
.stops button{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:700;font-size:15px}
.stops .sub{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.srow{display:flex;align-items:flex-start;gap:8px}
.sname{flex:1;min-width:0}
.grip{flex:0 0 auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;font-size:20px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:8px;background:var(--chip)}
.stops li.dragging{opacity:.85}
.stops li.dragging .srow{background:var(--chip);border-radius:10px}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--red);font-weight:700;cursor:pointer;font-size:12.5px}
.leg{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* mapa */
.mapbox{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;position:relative;touch-action:none;margin-top:6px}
.pin:hover circle{stroke-width:3}
#svg{display:block;width:100%;height:min(68vh,560px);cursor:grab}
.mapbox{isolation:isolate;z-index:0}
.leaflet-attribution-flag{display:none!important}
.maphint{font-size:12.5px;color:var(--muted);margin:8px 2px}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
.sheet{margin-top:10px}

/* info */
.info{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.box{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.box h2{margin:0 0 10px;font-size:18px;font-weight:800}
.box ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.box li{display:flex;gap:10px}
.box li .i{flex:0 0 26px;font-size:18px;line-height:1.3}
.box li p{margin:0}
.box .by{font-size:12px;color:var(--muted)}
.foods{display:flex;flex-wrap:wrap;gap:8px}
.food{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 13px;font-weight:700;font-size:14px}
button.food{cursor:pointer}
.food span{font-weight:600;color:var(--red);font-size:12.5px}
.install{background:var(--red);color:#fff}
.install h2{color:#fff}
.install ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.install li{display:list-item}
.install .btn{background:#fff;color:var(--red);margin-top:12px;width:100%}

/* spodna navigacia */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.tab .ic{font-size:20px;line-height:1.1;filter:grayscale(1);opacity:.75}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] .ic{filter:none;opacity:1}

.hello{font-size:15px}
.hello span{color:var(--muted);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,16,20,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheetbox{background:var(--surface);color:var(--ink);border-radius:22px;padding:22px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheetbox .kanji{font-family:var(--display);color:var(--red);font-size:12px;letter-spacing:.25em}
.sheetbox h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px}
.sheetbox p{margin:0;color:var(--muted)}
.sheetbox input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;font-size:17px}
.sheetbox .btn{padding:13px}
@media (min-width:600px){.modal{align-items:center}}
.minor{display:flex;gap:8px;flex-wrap:wrap}
.mini{border:0;background:none;padding:2px 0;font:inherit;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;cursor:pointer}
.mini.on{color:var(--red)}
.btn.soft{background:var(--chip);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{font-size:13px;padding:11px 8px;text-align:center}
.plan{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.calhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.calhead h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.calhead span{color:var(--muted);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-variant-numeric:tabular-nums}
.day .wd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .dn{font-size:15px;font-weight:800}
.day .bar{display:flex;gap:2px;width:100%;height:6px}
.day .bar i{flex:1;border-radius:3px;background:var(--line)}
.day .cnt{font-size:12px;font-weight:700;color:var(--muted)}
.day.free{background:transparent}
.day[aria-pressed="true"]{border:2px solid var(--ink);box-shadow:var(--shadow)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ptime{flex:0 0 auto;width:96px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 6px;font:inherit;font-size:13px}
.xbtn{flex:0 0 auto;border:0;background:none;color:var(--muted);font-size:15px;padding:4px 6px;cursor:pointer}
.loose{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:10px}
.ldot{flex:0 0 10px;height:10px;border-radius:50%;background:var(--c)}
.lname{flex:1;min-width:0;font-weight:700;font-size:14px}
.lname small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dates label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.dates input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px;font:inherit;font-size:16px;min-width:0}
.dates .btn{grid-column:1/-1}
.cal.pick{max-height:50vh;overflow:auto}
.newroute{display:flex;gap:8px}
.newroute input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.newroute .btn{flex:0 0 auto}
.pplist{display:flex;flex-direction:column;gap:2px;max-height:48vh;overflow:auto;margin:0 -6px}
.pprow{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);text-align:left;padding:9px 6px;border-radius:10px;cursor:pointer;font:inherit}
.pprow:hover{background:var(--chip)}
.pprow b{font-size:18px;color:var(--muted)}
.pprow.in b{color:var(--tokyo)}
.ih{margin:0 0 6px;font-size:15px;color:#fff}
.other{margin-top:12px;font-size:14px}
.other summary{cursor:pointer;font-weight:700}
.other ol{margin-top:6px}
#ppq{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
.noics [data-ics]{display:none}
.mapbox.real{touch-action:auto}
#lmap.darkmap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
#lmap{height:min(68vh,560px);width:100%;background:var(--chip)}
.lpin{width:32px;height:32px;border-radius:50%;background:var(--surface);border:3px solid var(--a);display:grid;place-items:center;font-size:16px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.lpin.tip{border-width:4px;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--a)}
.lpin.done{opacity:.55}
.lcl{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px;border:3px solid var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.35)}
.pop{display:flex;flex-direction:column;gap:3px;font-family:var(--body);color:#1b1d22}
.pop b{font-size:14px}.pop small{font-size:12px;color:#6a6e78}.pop p{margin:4px 0 0;font-size:13px;line-height:1.4}
.popb{display:flex;gap:8px;margin-top:8px}.popb a,.popb button{flex:1;border:0;border-radius:9px;padding:8px;font:inherit;font-size:13px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.popb a{background:#1b1d22;color:#fff!important}.popb button{background:#eceae3;color:#1b1d22}
.legend2{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lg{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:50%}.lg span{color:var(--muted);font-weight:600}
.fqbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--red-soft);border-radius:12px;padding:8px 12px;margin-bottom:4px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><div class="wrap">
  <header class="hero">
    <span class="kanji">日本 · TOKYO · KYOTO · OSAKA</span>
    <h1>Japonsko guide</h1>
    <div class="hello" id="hello" hidden></div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="cities" id="cities" role="group" aria-label="Mesto"></div>

  <main id="view"></main>
</div>

<div class="tabs"><nav role="tablist" aria-label="Sekcie">
  <button class="tab" role="tab" data-tab="tipy" id="t-tipy"><span class="ic">📍</span>Tipy</button>
  <button class="tab" role="tab" data-tab="trasy" id="t-trasy"><span class="ic">🚃</span>Trasy</button>
  <button class="tab" role="tab" data-tab="plan" id="t-plan"><span class="ic">📅</span>Plán</button>
  <button class="tab" role="tab" data-tab="mapa" id="t-mapa"><span class="ic">🗺️</span>Mapa</button>

", "tags": ["must"], "note": "Tato restika asi bude full, ale ked budete vidiet gyukatsu, urcite na to chodte. To je steak, casto aj wagyu, vyprazany v tempure. Je to super dobre, to je fakt must.", "url": "https://www.google.com/maps/place/GYUKATSU+Kyoto+Katsugyu+Shibuya+Dogenzaka/@35.656472,139.6960664,345m/data=!3m1!1e3!4m6!3m5!1s0x60188b5609c33713:0x9ec2bfd2013c81a7!8m2!3d35.6572791!4d139.6961933!16s%2Fg%2F11b_3ghj4j", "lat": 35.6572791, "lng": 139.6961933, "code": "SH-05", "short": "Tato restika asi bude full, ale ked budete vidiet gyukatsu, urcite na to chodte.", "offmap": false}, {"id": "gZvjNHXei8Qx1zpR8", "name": "Starbucks Reserve Roastery Tokyo", "city": "tokyo", "area": "SH", "cat": "cafe", "tags": ["1–2 hod"], "note": "Starbucks Reserve Roastery je taka haluz. Ak ste to nikdy nevideli, tak to urcite chodte pozriet, ak vyjde cas, ale treba na to aj 1–2 hodiny. Tychto roastery je na svete asi 6 alebo 7 a je to fakt unikatne, mega zaujimave a aj dobre veci tam maju.", "url": "https://maps.app.goo.gl/gZvjNHXei8Qx1zpR8", "lat": 35.6492642, "lng": 139.6925907, "code": "SH-06", "short": "Starbucks Reserve Roastery je taka haluz.", "offmap": false}, {"id": "Ebxz7kHA2TdB6n6p8", "name": "The Matcha Tokyo Miyashita Park", "city": "tokyo", "area": "SH", "cat": "cafe", "tags": [], "note": "Tu maju dobru matchu a veci z matche, ale dolezite, preco to posielam, je, ze rovno nad tym je tento rooftop park.", "url": "https://maps.app.goo.gl/Ebxz7kHA2TdB6n6p8", "lat": 35.6608703, "lng": 139.7017163, "code": "SH-07", "short": "Tu maju dobru matchu a veci z matche, ale dolezite, preco to posielam, je, ze rovno nad ty…", "offmap": false}, {"id": "465vxNWfFSXRF75z9", "name": "Miyashita Park", "city": "tokyo", "area": "SH", "cat": "park", "tags": ["den aj noc"], "note": "Vsade su skateri a mladi Japonci a je tam cool vibe cez den aj v noci.", "url": "https://maps.app.goo.gl/465vxNWfFSXRF75z9", "lat": 35.6617182, "lng": 139.7016472, "code": "SH-08", "short": "Vsade su skateri a uyi. To minimalne raz treba absolvovat.", "url": "https://maps.app.goo.gl/VYxffERT2bAWgzLd8", "lat": 35.6594349, "lng": 139.6979207, "code": "SH-11", "short": "Toto je dalsia sushi belt v Shibuyi.", "offmap": false}, {"id": "nvFBvgqnr2ASRXwMA", "name": "Tsukiji Sushisei Shibuya", "city": "tokyo", "area": "SH", "cat": "sushi", "tags": [], "note": "Dalsie sushi, co som tusim bol, uz ani nepamatam 😀", "url": "https://maps.app.goo.gl/nvFBvgqnr2ASRXwMA", "lat": 35.6590658, "lng": 139.6989153, "code": "SH-12", "short": "Dalsie sushi, co som tusim bol, uz ani nepamatam 😀", "offmap": false}, {"id": "VjvDwwUyR3KHhmDW8", "name": "Sushizanmai Shibuya", "city": "tokyo", "area": "SH", "cat": "sushi", "tags": ["dobra cena"], "note": "Toto Sushizanmai je realne siet s viac prevadzkami, ale na toto som zobral aj chalanov, ked dosli pozriet… Fakt dobre sushi, fakt, a za prijatelnu cenu.", "url": "https://maps.app.goo.gl/VjvDwwUyR3KHhmDW8", "lat": 35.6592549, "lng": 139.6979579, "code": "SH-13", "short": "Toto Sushizanmai je realne siet s viac prevadzkami, ale na toto som zobral aj chalanov, ke…", "offmap": false}, {"id": "QrEeYTXkvuaAovpm7", "name": "Rokuetei Hitsumabushi", "city": "tokyo", "area": "SH", "cat": "food", "tags": [], "note": "Toto v Shibuyi… tie japonske steaky na ryzi su neuveritelne.", "url": "https://maps.app.goo.gl/QrEeYTXkvuaAovpm7", "lat": 35.658168, "lng": 139.6986262, "code": "SH-14", "short": "Toto v Shibuyi…", "offmap": false}, {"id": "6y5hYLhqwnJG6sXC8", "name": "Shabu-shabu On-yasai Shibuya", "city": "tokyo", "area": "SH", "cat": "food", "tags": ["all you can eat"], "note": "Toto je v Shibuyi take jedlo, co sa vola shabu shabu… je to japonska verzia hotpotu z Ciny. Sem som zobral celu partiu… je to pecka. Stoji to nejak 4000–8000 jenov, cize lacne, a je to all you can eat na hodinu, s priplatkom aj wagyu all you can eat. Toto bolo mega dobre, to odporucam… ak nie tuto konkretnu restiku, tak skusit niekde shabu shabu.", "url": "https://maps.app.goo.gl/6y5hYLhqwnJG6sXC8", "lat": 35.6613536, "lng": 139.7010709, "code": "SH-15", "short": "Toto je v Shibuyi take jedlo, co sa vola shabu shabu…", "offmap": false}, {"id": "RwjHJx6KoTA7uzFV7", "name": "Harajuku", "city": "tokyo", "area": "HJ", "cat": "area", "tags": ["must", "pol dna+"], "note": "Zo Shibuye sa da prejst pesi az sem. Je to Harajuku a tu fakt odporucam dat si aspon minimalne pol dna na prechadzanie a cekovanie obchodov. Je tam milion super 2nd hand dealov a nalozene vintage obchody, fakt je to tam vsetko mega pekne. Za mna realne najlepsia cast Tokya. Ked tam bol Kanye, tak sem chodil, aj ho tam videli.", "url": "https://maps.app.goo.gl/RwjHJx6KoTA7uzFV7", "lat": 35.6699682, "lng": 139.709008, "code": "HJ-02", "short": "Zo Shibuye sa da prejst pesi az sem.", "offmap": false}, {"id": "SizrMVkYwKaH1h2e8", "name": "Harajuku Station", "city": "tokyo", "area": "HJ", "cat": "transit", "tags": [], "note": "Na Harajuku som vacsinou chodil pesi, ale da sa dojst aj tusim 2 zastavky na tuto stanicu.", "url": "https://maps.app.goo.gl/SizrMVkYwKaH1h2e8", "lat": 35.6700901, "lng": 139.7024662, "code": "HJ-03", "short": "Na Harajuku som vacsinou chodil pesi, ale da sa dojst aj tusim 2 zastavky na tuto stanicu.", "offmap": false}, {"id": "54CMtuSCbrA7nk9D6", "name": "Meiji Jingu", "city": "tokyo", "area": "HJ", "cat": "temple", "tags": ["must"], "note": "A hned za nou je park a Meiji Jingu shrine, kde by ste sa urcite mali ist pozriet. Je tam taky chram, pekne miesto na ceremonialy… niekedy aj svadba… Mega stary strom v chrame a tam sa robi taka vec, ze napises svoje priania na take drievko a zavesis to tam… je to taka cool cinnost.", "url": "https://maps.app.goo.gl/54CMtuSCbrA7nk9D6", "lat": 35.6763976, "lng": 139.6993259, "code": "HJ-04", "short": "A hned za nou je park a Meiji Jingu shrine, kde by ste sa urcite mali ist pozriet.", "offmap": false}, {"id": "w7VUu4ZUG62ssiVe8", "name": "Tokyu Plaza Harajuku „Harakado\"", "city": "tokyo", "area": "HJ", "cat": "landmark", "tags": [], "note": "Po ceste do Harajuku sa ide vacsinou okolo tejto budovy. To je iba tip ako pekna budova.", "url": "https://maps.app.goo.gl/w7VUu4ZUG62ssiVe8", "lat": 35.6684259, "lng": 139.7049858, "code": "HJ-05", "short": "Po ceste do Harajuku sa ide vacsinou okolo tejto budovy.", "offmap": false}, {"id": "CL2Euch5Nj496RyW9", "name": "Liberty Walk Tokyo", "city": "tokyo", "area": "HJ", "cat": "cars", "tags": ["merch"], "note": "V Harajuku je tento shop. Tu som si kupil tricko, mikinu a pod… Je to jedna, asi najznamejsia tokijska tunerska firma a maju taky merch shop a vyzera to super, vzdy tam vidis nejake nalozene auto a podobne. Je to cool vidiet subkultury v Tokyu a vsade poblizku su same nalozene obchody, fakt tak originalne veci a produkty a obchodiky, ze sa z toho clovek zblazni.", "url": "https://maps.app.goo.gl/CL2Euch5Nj496RyW9", "lat": 35.6694863, "lng": 139.7082341, "code": "HJ-06", "short": "V Harajuku je tento shop.", "offmap": false}, {"id": "rT2arH1WcXHxzgd8A", "name": "Rizlabo Kitchen", "city": "tokyo", "area": "HJ", "cat": "sweet", "tags": [], "note": "V Harajuku je aj tato restika na japonske palacinky. Tych je viac, takze treba sa aj pozerat, co je ponuka na ulici… V Japonsku sa naozaj bez obav da fungovat tak, ze clovek vidi plagat alebo obrazok a moze ist do tej restiky… neni sanca sa ojebat… Neni to ako u nas na Slovensku, kde bez kontroly Google Maps by som tam nevkrocil.", "url": "https://maps.app.goo.gl/rT2arH1WcXHxzgd8A", "lat": 35.6685791, "lng": 139.7108039, "code": "HJ-07", "short": "V Harajuku je aj tato restika na japonske palacinky.", "offmap": false}, {"id": "6RRpVyTx1H6cbzK5A", "name": "Omoide Yokocho", "city": "tokyo", "area": "SJ", "cat": "bar", "tags": ["must", "vecer"], "note": "Toto je asi najznamejsia ta ulicka yokocho… je to tam fakt pekne, fotogenicke, mozno drahe kvoli turistom, ale to je tiez uplna povinnost, je to jedna z najhlavnejsich veci, co vidiet.", "url": "https://maps.app.goo.gl/6RRpVyTx1H6cbzK5A", "lat": 35.6927037, "lng": 139.6995778, "code": "SJ-01", "short": "Toto je asi najznamejsia ta ulicka yokocho…", "offmap": false}, {"id": "PeX7GiENsAJ64Bru7", "name": "Tokyu Kabukicho Tower", "city": "tokyo", "area": "SJ", "cat": "fun", "tags": ["must", "vecer"], "note": "Toto je budova na Kabukicho namesti. Tu som travil kazdy den… byval som v Shinjuku. Toto namestie, hlavne tam musite ist vecer. Je to najvacsi bizar, aky sa da. Ti ludia, ti ozrani… ten chaos… vsetko uplna haluz. Vsade su herne a bowlingy a sipky nonstop a v tom Kabukicho Tower vnutri je to sialene osvetlene a milion mini barov a sem musite ist, vazne ze URCITE.", "url": "https://maps.app.goo.gl/PeX7GiENsAJ64Bru7", "lat": 35.6957513, "lng": 139.7005894, "code": "SJ-02", "short": "Toto je budova na Kabukicho namesti.", "offmap": false}, {"id": "Jh4JTpKiHhJfcVxq7", "name": "Kamukura Ramen Shinjuku", "city": "tokyo", "area": "SJ", "cat": "food", "tags": [], "note": "Toto je ramen, ktory som mal strasne rad a po posilke som vzdy isiel, ale popravde neviem, ci to kazdemu sadne rovnako.", "url": "https://maps.app.goo.gl/Jh4JTpKiHhJfcVxq7", "lat": 35.6943956, "lng": 139.70208, "code": "SJ-03", "short": "Toto je ramen, ktory som mal strasne rad a po posilke som vzdy isiel, ale popravde neviem,…", "offmap": false}, {"id": "VrUciSwQLFLWkQHw8", "name": "Shinjuku Golden Gai", "city": "tokyo", "area": "SJ", "cat": "bar", "tags": ["must", "vecer"], "note": "Golden Gai je taka asi 100+ rokov stara yokocho s barmi a vsetko je to take ruin vibe. Ale tam sa plati casto aj 1500 jenov za sedenie ako fee, lebo tam je tak malo miesta… Kazdopadne cool zazitok… jedna z hlavnych atrakcii.", "url": "https://maps.app.goo.gl/VrUciSwQLFLWkQHw8", "lat": 35.6941118, "lng": 139.7047611, "code": "SJ-04", "short": "Golden Gai je taka asi 100+ rokov stara yokocho s barmi a vsetko je to take ruin vibe.", "offmap": false}, {"id": "tQ8xrq8J6kQ6DVzB7", "name": "Tokyo Metropolitan Government Building", "city": "tokyo", "area": "SJ", "cat": "view", "tags": ["zadarmo"], "note": "Blizko Shinjuku je tato budova. Je to rooftop na asi, neviem, 50. poschodi, kde vidiet velmi pekne vyhlady. A to, co je na tom super, je, ze to je kompletne zadarmo… ziaden vstup ani nic. Je to vladna budova a toto je proste pre ludi zadarmo… takze vam odporucam tam ist… nebookuje sa nic.", "url": "https://maps.app.goo.gl/tQ8xrq8J6kQ6DVzB7", "lat": 35.689733, "lng": 139.6916563, "code": "SJ-05", "short": "Blizko Shinjuku je tato budova.", "offmap": false}, {"id": "7TktssjErUWCgfAw9", "name": "Darts Cafe DELTA Shinjuku", "city": "tokyo", "area": "SJ", "cat": "fun", "tags": ["vecer"], "note": "Sem sme v Shinjuku chodili hravat sipky… To by som odporucal, aby ste raz isli skusit… ide o ten vibe… Tam to ti ludia maju fakt ako hobby a hlavne tie masiny maju brutal animacie… ved to by ste uvideli.", "url": "https://maps.app.goo.gl/7TktssjErUWCgfAw9", "lat": 35.6940441, "lng": 139.7015024, "code": "SJ-06", "short": "Sem sme v Shinjuku chodili hravat sipky…", "offmap": false}, {"id": "CBNmswBBsTAKaprD6", "name": "EXBAR Tokyo plus", "city": "tokyo", "area": "SJ", "cat": "fun", "tags": ["vecer"], "note": "Sem sme tiez chodili hravat sipky a maju tam najlepsi pinball a beer pong… Ten beer pong musite skusit, oni maju stol za par litrov s full displejom a animaciami, fakt haluz.", "url": "https://maps.app.goo.gl/CBNmswBBsTAKaprD6", "lat": 35.6898815, "lng": 139.702266, "code": "SJ-07", "short": "Sem sme tiez chodili hravat sipky a maju tam najlepsi pinball a beer pong…", "offmap": false}, {"id": "d17PK7zy8BAMSnrAA", "name": "Shinjuku Gyoen", "city": "tokyo", "area": "SJ", "cat": "park", "tags": ["jesen"], "note": "Shinjuku Garden je najvacsi park v Tokyu… Maju tam aj sklenik… bonsaje… nadherny travnik… vyhlady… je to tam nadherne… Ked uz bude jesen, tak tam maju brutalne zlte ginkgo stromy.", "url": "https://maps.app.goo.gl/d17PK7zy8BAMSnrAA", "lat": 35.6867561, "lng": 139.7126225, "code": "SJ-08", "short": "Shinjuku Garden je najvacsi park v Tokyu…", "offmap": false}, {"id": "VxajfEKwLaWxQNkt9", "name": "Standing Sushi Misaki Shinjuku", "city": "tokyo", "area": "SJ", "cat": "sushi", "tags": ["lacne"], "note": "Toto je este Shinjuku, ale je to mega sushi a haluz je, ze tam clovek stoji a doslovne objednava po kuskoch a dostane to do 1 min do ruky. A samozrejme lacne.", "url": "https://maps.app.goo.gl/VxajfEKwLaWxQNkt9", "lat": 35.690371, "lng": 139.699383, "code": "SJ-09", "short": "Toto je este Shinjuku, ale je to mega sushi a haluz je, ze tam clovek stoji a doslovne obj…", "offmap": false}, {"id": "CNwRRrn7x6zDGuxr6", "name": "Shinjuku Station", "city": "tokyo", "area": "SJ", "cat": "transit", "tags": [], "note": "Shinjuku Station, kam asi dojdete metrom… je realne ze najvacsia stanica na svete. Denne tam prejde nejak 5 milionov ludi.", "url": "https://maps.app.goo.gl/CNwRRrn7x6zDGuxr6", "lat": 35.6896067, "lng": 139.7005713, "code": "SJ-10", "short": "Shinjuku Station, kam asi dojdete metrom…", "offmap": false}, {"id": "3WuAXTCb6vx9Pd9N6", "name": "Ryu no Miyako Inshokugai", "city": "tokyo", "area": "SJ", "cat": "food", "tags": ["vecer"], "note": "Dalsia crazy restika v Shinjuku, co takto vyzera… fakt blaznive svetla, uplna haluz.", "url": "https://maps.app.goo.gl/3WuAXTCb6vx9Pd9N6", "lat": 35.6906414, "lng": 139.7020365, "code": "SJ-11", "short": "Dalsia crazy restika v Shinjuku, co takto vyzera…", "offmap": false}, {"id": "wALi5cZDiZimxMek6", "name": "Pachinko Espace Nittaku Kabukicho", "city": "tokyo", "area": "SJ", "cat": "fun", "tags": ["bizar"], "note": "Toto je v Shinjuku, ale sem sa musite ist pozriet… je to taka japonska verzia kasina a je to najvacsi bizar, aky som kedy videl… vola sa to pachinko… je to vsade a je to super divne… neuveritelny hluk, blikanie a pod.", "url": "https://maps.app.goo.gl/wALi5cZDiZimxMek6", "lat": 35.6940714, "lng": 139.7007764, "code": "SJ-12", "short": "Toto je v Shinjuku, ale sem sa musite ist pozriet…", "offmap": false}, {"id": "TU8gx6LSZ86Ao5AJ7", "name": "Ginkgo aleja, Meiji Jingu Gaien", "city": "tokyo", "area": "HJ", "cat": "cars", "tags": ["jesen"], "note": "Tato ulica je na jesen cela zlta, lebo su tam tie ginkgo stromy, a tam uvidis nonstop aj drahe auta a tunerov a Tokyo Drift typkov a tak. To mi odporucil jeden Japonec, co ma potom zobral s nimi s autami.", "url": "https://maps.app.goo.gl/TU8gx6LSZ86Ao5AJ7", "lat": 35.6754399, "lng": 139.7182668, "code": "HJ-08", "short": "Tato ulica je na jesen cela zlta, lebo su tam tie ginkgo stromy, a tam uvidis nonstop aj d…", "offmap": false}, {"id": "VmyzaV6NkmcXBcEE6", "name": "Hie Shrine", "city": "tokyo", "area": "RP", "cat": "temple", "tags": ["hidden gem"], "note": "Toto uz je ina lokalita… ale tento tip je vyborny, pretoze tu mas taky maly chram, ku ktoremu sa ide cez take cervene stlpy… Kvoli nim chodia ludia do Kyota daleko na pol dna sa fotit, ale realne je to zabity cas a toto je rovno v Tokyu a efekt je identicky… clovek nevie ani, kde je, a fotky su super.", "url": "https://maps.app.goo.gl/VmyzaV6NkmcXBcEE6", "lat": 35.6747136, "lng": 139.7396621, "code": "RP-01", "short": "Toto uz je ina lokalita…", "offmap": false}, {"id": "1swn5WsSpBCoLbDT9", "name": "Bingo Sports", "city": "tokyo", "area": "RP", "cat": "cars", "tags": [], "note": "Hned vedla je showroom nejakeho miliardara, co tam ma vystavene auta, a mozes tam ist len tak sa pozriet.", "url": "https://maps.app.goo.gl/1swn5WsSpBCoLbDT9", "lat": 35.6736237, "lng": 139.7401048, "code": "RP-02", "short": "Hned vedla je showroom nejakeho miliardara, co tam ma vystavene auta, a mozes tam ist len …", "offmap": false}, {"id": "jZToMihq8iYik6fW7", "name": "Naruse Unagi Roppongi", "city": "tokyo", "area": "RP", "cat": "food", "tags": ["must"], "note": "Toto je za mna najlepsie jedlo zo seafoodu, ake existuje: grilovany uhor. Toto sa uz nachadza v Roppongi.", "url": "https://maps.app.goo.gl/jZToMihq8iYik6fW7", "lat": 35.6616997, "lng": 139.735385, "code": "RP-03", "short": "Toto je za mna najlepsie jedlo zo seafoodu, ake existuje: grilovany uhor.", "offmap": false}, {"id": "JfUfyZssmFJ49jL37", "name": "Roppongi Hills", "city": "tokyo", "area": "RP", "cat": "area", "tags": [], "note": "Roppongi je taka luxury cast… tam byvaju bohati Japonci… je to tam fancy, ale je to tam pekne a vsade je vsetko co pozerat… skvele bary a pod.", "url": "https://maps.app.goo.gl/JfUfyZssmFJ49jL37", "lat": 35.6607345, "lng": 139.7292066, "code": "RP-04", "short": "Roppongi je taka luxury cast…", "offmap": false}, {"id": "nnHeE8j7tVexdJzP9", "name": "Azabudai Hills", "city": "tokyo", "area": "RP", "cat": "view", "tags": ["zadarmo", "teamLab"], "note": "Toto je taky development, ktory stal niekolko miliard a stavali to realnych 20 rokov. Vola sa to Azabudai Hills a su tam galerie, obchody a podobne. Je tam aj teamLab Tokyo, co by ste mali urcite dat, je to take zname turisticke, taka interaktivna galeria. No a v tejto budove, ked idete na horne poschodie, je zadarmo tiez vyhliadka, odkial sa da velmi dobre vidiet ta eiffelovka. O nej som pocul, ze sa neoplati na nu ist… tak namiesto toho mam tento trik, ze ides zadarmo do tejto budovy oproti nej a mas na nu vyhlad, a spojis to s teamLabom.", "url": "https://maps.app.goo.gl/nnHeE8j7tVexdJzP9", "lat": 35.6615447, "lng": 139.7408302, "code": "RP-05", "short": "Toto je taky development, ktory stal niekolko miliard a stavali to realnych 20 rokov.", "offmap": false}, {"id": "fJvGw9zapa2oDLYq6", "name": "Senso-ji / Asakusa Shrine", "city": "tokyo", "area": "AS", "cat": "temple", "tags": ["must"], "note": "Je toho strasne vela, ale urcite sa neda zabudnut na Asakusa shrine. Je to jeden z top 3 chramov v Tokyu, takze to je fakt must see. Tam si potom mozete ceremonialne vyvestit z takych paliciek, ako to tam ludia robia, to urobte urcite :D", "url": "https://maps.app.goo.gl/fJvGw9zapa2oDLYq6", "lat": 35.7151665, "lng": 139.7974389, "code": "AS-01", "short": "Je toho strasne vela, ale urcite sa neda zabudnut na Asakusa shrine.", "offmap": false}, {"id": "ZXSD3GpHFKxqAmu /* ---------- vzdialenost ---------- */
function km(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function fmtKm(d){return d<1?Math.round(d*1000/10)*10+" m":(d<10?d.toFixed(1):Math.round(d))+" km"}
function walk(d){const m=Math.round(d*1000/75);return m<=1?"hneď vedľa":m<=25?`~${m} min pešo`:"radšej metrom"}

/* ---------- google maps linky ---------- */
const CITY_EN={tokyo:"Tokyo",kyoto:"Kyoto",osaka:"Osaka",nara:"Nara",kamakura:"Kamakura"};
function photoUrl(p){return "https://www.google.com/search?tbm=isch&q="+encodeURIComponent(p.name.replace(/\(.*?\)/g,"")+" "+CITY_EN[p.city]+" Japan")}
function dirUrl(stops){
  const pts=stops.map(id=>byId[id]).filter(Boolean);
  if(pts.length<2) return pts[0]?pts[0].url:"#";
  const ll=p=>`${p.lat},${p.lng}`;
  const o=ll(pts[0]), d=ll(pts[pts.length-1]);
  const w=pts.slice(1,-1).map(ll).join("|");
  const far = pts.some((p,i)=>i&&km(pts[i-1],p)>2.5);
  return `https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${d}${w?"&waypoints="+encodeURIComponent(w):""}&travelmode=${far?"transit":"walking"}`;
}

}

    $("#routes").innerHTML=allRoutes().filter(x=>x.city===S.city).map(x=>{const pts=orderOf(x).map(id=>byId[id]).filter(p=>p&&!p.offmap);
      return `<polyline points="${pts.map(p=>X(p)+","+Y(p)).join(" ")}" fill="none" stroke="#d7263d" stroke-opacity=".4" stroke-width="${3*px}" stroke-dasharray="${6*px} ${6*px}"/>`}).join("");

  const apply=()=>{svg.setAttribute("viewBox",mapState.vb.join(" "));draw()};
  const zoom=(f,cx,cy)=>{const v=mapState.vb;cx=cx??v[0]+v[2]/2;cy=cy??v[1]+v[3]/2;
    const nw=Math.min(Math.max(v[2]*f,mapState.base[2]/40),mapState.base[2]*1.5),nh=nw*v[3]/v[2];

/* ---------- PLAN + KALENDAR ---------- */
const WD=["Ne","Po","Ut","St","Št","Pi","So"], WDF=["nedeľa","pondelok","utorok","streda","štvrtok","piatok","sobota"];
let PLAN=(()=>{const p=store.get("plan",null);return p&&typeof p==="object"&&p.days?p:{start:"",end:"",days:{}}})();
function savePlan(){store.set("plan",PLAN)}
const dParse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const dStr=dt=>dt.toISOString().slice(0,10);
function tripDays(){if(!PLAN.start||!PLAN.end)return[];const out=[];let d=dParse(PLAN.start);const e=dParse(PLAN.end);
  for(let i=0;i<60&&d<=e;i++){out.push(dStr(d));d=new Date(d.getTime()+864e5)}return out}
const dayItems=ds=>(PLAN.days[ds]||[]).filter(x=>byId[x.id]);
const fmtDay=(ds,long)=>{const d=dParse(ds);return long?`${WDF[d.getUTCDay()]} ${d.getUTCDate()}. ${d.getUTCMonth()+1}.`:`${WD[d.getUTCDay()]} ${d.getUTCDate()}. ${d.getUTCMonth()+1}.`};
function dayCities(ds){const c={};dayItems(ds).forEach(x=>{const k=byId[x.id].city;c[k]=(c[k]||0)+1});return Object.keys(c).sort((a,b)=>c[b]-c[a])}
const plannedDay=id=>tripDays().find(ds=>dayItems(ds).some(x=>x.id===id));
function addToDay(ds,ids){const list=PLAN.days[ds]||(PLAN.days[ds]=[]);let n=0;
  ids.forEach(id=>{Object.keys(PLAN.days).forEach(k=>{if(k!==ds)PLAN.days[k]=PLAN.days[k].filter(x=>x.id!==id)});
    if(!list.some(x=>x.id===id)){list.push({id,time:""});n++}});savePlan();return n}
const miest=n=>n===1?"miesto":n>1&&n<5?"miesta":"miest";

function datesForm(){return `<section class="box"><h2>📅 Kedy idete?</h2>
  <p style="margin:0 0 12px;color:var(--muted)">Zadaj termín cesty a potom si do jednotlivých dní naklikáš miesta.</p>
  <form id="datesform" class="dates"><label>Od<input type="date" id="pstart" value="${PLAN.start}" required></label>
  <label>Do<input type="date" id="pend" value="${PLAN.end}" required></label>
  <button class="btn maps" type="submit">Uložiť termín</button></form>
  ${PLAN.start?`<button class="linkbtn" id="datescancel" style="margin-top:10px">Zrušiť</button>`:""}</section>`}

function renderPlan(){
  const days=tripDays();

  if(!S.day||!days.includes(S.day))S.day=days.find(ds=>dayItems(ds).length)||days[0];
  const items=dayItems(S.day), ids=items.map(x=>x.id), cs=dayCities(S.day);
  const loose=[...S.want].filter(id=>byId[id]&&!plannedDay(id));
  const usedCities=[...new Set(days.flatMap(dayCities))];
  const timed=items.filter(x=>x.time).length;
  $("#view").innerHTML=`<div class="plan">
  <div class="calhead"><h2>${fmtDay(days[0])} – ${fmtDay(days[days.length-1])}</h2><span>${days.length} dní · ${days.reduce((s,ds)=>s+dayItems(ds).length,0)} miest</span></div>
  <div class="cal">${days.map(ds=>{const d=dParse(ds),c=dayCities(ds),n=dayItems(ds).length;
    return `<button class="day${n?"":" free"}" data-day="${ds}" aria-pressed="${S.day===ds}"><span class="wd">${WD[d.getUTCDay()]}</span><span class="dn">${d.getUTCDate()}.${d.getUTCMonth()+1}.</span><span class="bar">${c.length?c.map(k=>`<i style="background:var(--${k})"></i>`).join(""):"<i></i>"}</span><span class="cnt">${n||"·"}</span></button>`}).join("")}</div>

  <section class="route dayd" style="--c:var(--${cs[0]||"red"})">
    <header><div class="rt"><span class="line">${esc(fmtDay(S.day,true))}</span>${cs.length?`<span style="font-size:12.5px;color:var(--muted)">${cs.map(k=>cityOf(k).name).join(" + ")}</span>`:""}</div></header>
    ${items.length?`<p class="hint">Čas je nepovinný. Poradie zmeníš cez <b>⠿</b>.${timed>1?` <button class="linkbtn" data-sorttime>Zoradiť podľa času</button>`:""}</p>
    <ol class="stops" data-drag="day:${S.day}">${items.map((x,i)=>{const p=byId[x.id],nx=items[i+1]&&byId[items[i+1].id];

      <div class="srow"><input class="ptime" type="time" value="${esc(x.time||"")}" data-time="${p.id}" aria-label="Čas pre ${esc(p.name)}">
      <button class="sname" data-goto="${p.id}">${CATS[p.cat][0]} ${esc(p.name)}<span class="sub">${esc(areaOf(p.area).name)}</span></button>
      <button class="xbtn" data-rm="${p.id}" aria-label="Odobrať">✕</button><span class="grip" aria-label="Posunúť">⠿</span></div>
      ${nx?`<span class="leg">↓ ${walk(km(p,nx))} · ${fmtKm(km(p,nx))}</span>`:""}</li>`}).join("")}</ol>
    ${ids.length>1?`<a class="btn maps" href="${dirUrl(ids)}" target="_blank" rel="noopener">🧭 Navigovať celý deň v Google Maps</a>`:`<a class="btn maps" href="${esc(byId[ids[0]].url)}" target="_blank" rel="noopener">📍 Otvoriť v Google Maps</a>`}
    <div class="two"><a class="btn soft" href="${icsHref([S.day])}" download="japonsko-${S.day}.ics" data-ics>🍎 Do kalendára v iPhone</a><a class="btn soft" href="${gcalUrl(S.day)}" target="_blank" rel="noopener">📆 Google Kalendár</a></div>`
    :`<p class="empty" style="padding:14px 4px">Na tento deň zatiaľ nič. Pridaj trasu alebo ⭐ miesta nižšie, alebo ťukni na <b>📅 Do plánu</b> pri hocijakom tipe.</p>`}
  </section>

  ${loose.length?`<section class="box"><h2>⭐ Nezaradené (${loose.length})</h2><p class="hint" style="margin:-4px 0 10px">Tvoje hviezdičky, ktoré ešte nemajú deň.</p>
    <div class="loose">${loose.map(id=>{const p=byId[id];return `<div class="lrow" style="--c:var(--${p.city})"><span class="ldot"></span><span class="lname">${CATS[p.cat][0]} ${esc(p.name)}<small>${esc(cityOf(p.city).name)} · ${esc(areaOf(p.area).name)}</small></span><button class="chip" data-addday="${id}">+ ${fmtDay(S.day)}</button></div>`}).join("")}</div></section>`:""}

  <section class="box"><h2>🚃 Pridať celú trasu na ${fmtDay(S.day)}</h2><div class="foods">${allRoutes().map(r=>`<button class="food" data-addroute="${r.id}" style="border-left:4px solid var(--${r.city})">${esc(r.title)}</button>`).join("")}</div></section>

  <section class="box"><h2>🗓️ Celá cesta</h2>
    <div class="two"><a class="btn soft" href="${icsHref(days)}" download="japonsko-cesta.ics" data-ics>🍎 Celý plán do iPhone kalendára</a><button class="btn soft" id="editdates">Zmeniť termín</button></div>
    <p class="hint" style="margin-top:10px">Na Androide alebo PC použi pri každom dni <b>📆 Google Kalendár</b>.</p>
    <p style="margin:12px 0 0"><button class="linkbtn" id="clearplan">Vymazať celý plán</button> <span id="clearq" hidden>Naozaj? <button class="chip" id="cleary">Áno, vymazať</button></span></p>
  </section></div>`;
  $("#editdates").onclick=()=>{S.editDates=true;renderPlan()};
  $("#clearplan").onclick=()=>$("#clearq").hidden=false;
  $("#cleary").onclick=()=>{PLAN.days={};savePlan();toast("Plán vymazaný");renderPlan()};
  const sel=$(`.day[aria-pressed="true"]`);if(sel)sel.scrollIntoView({block:"nearest",inline:"center"});
}
function bindDates(){
  $("#datesform").addEventListener("submit",e=>{e.preventDefault();const a=$("#pstart").value,b=$("#pend").value;
    if(!a||!b){toast("Vyplň oba dátumy");return}
    if(b<a){toast("Koniec je skôr ako začiatok");return}
    if((dParse(b)-dParse(a))/864e5>59){toast("Najviac 60 dní");return}
    PLAN.start=a;PLAN.end=b;savePlan();S.editDates=false;S.day=null;toast("Termín uložený");renderPlan()});
  const c=$("#datescancel");if(c)c.onclick=()=>{S.editDates=false;renderPlan()};
}

/* --- kalendar: .ics (iPhone) a Google --- */
const icsEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
function fold(l){let o="";while(l.length>70){o+=l.slice(0,70)+"\r\n ";l=l.slice(70)}return o+l}
function dayText(ds){return dayItems(ds).map(x=>{const p=byId[x.id];return `${x.time?x.time+" ":""}${p.name}\n${p.note}\n${p.url}`}).join("\n\n")}
function addMin(t,m){const [h,mm]=t.split(":").map(Number);let v=Math.min(h*60+mm+m,23*60+59);return String(Math.floor(v/60)).padStart(2,"0")+String(v%60).padStart(2,"0")}
function icsText(list){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Japonsko guide//SK","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Japonsko",
   "BEGIN:VTIMEZONE","TZID:Asia/Tokyo","BEGIN:STANDARD","DTSTART:19700101T000000","TZOFFSETFROM:+0900","TZOFFSETTO:+0900","TZNAME:JST","END:STANDARD","END:VTIMEZONE"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  list.forEach(ds=>{const items=dayItems(ds);if(!items.length)return;
    const d=ds.replace(/-/g,""),nd=dStr(new Date(dParse(ds).getTime()+864e5)).replace(/-/g,"");
    L.push("BEGIN:VEVENT",`UID:den-${ds}@japonsko-guide`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${nd}`,
      `SUMMARY:${icsEsc("Japonsko: "+dayCities(ds).map(k=>cityOf(k).name).join(" + ")+" ("+items.length+" "+miest(items.length)+")")}`,
      `DESCRIPTION:${icsEsc(dayText(ds))}`,"TRANSP:TRANSPARENT","END:VEVENT");
    items.filter(x=>x.time).forEach(x=>{const p=byId[x.id];
      L.push("BEGIN:VEVENT",`UID:${ds}-${p.id}@japonsko-guide`,`DTSTAMP:${stamp}`,`DTSTART;TZID=Asia/Tokyo:${d}T${x.time.replace(":","")}00`,
        `DTEND;TZID=Asia/Tokyo:${d}T${addMin(x.time,60)}00`,`SUMMARY:${icsEsc(p.name)}`,`LOCATION:${icsEsc(p.name)}`,
        `DESCRIPTION:${icsEsc(p.note+"\n"+p.url)}`,`URL:${p.url}`,"END:VEVENT")})});
  L.push("END:VCALENDAR");return L.map(fold).join("\r\n")}
const icsHref=list=>"data:text/calendar;charset=utf-8,"+encodeURIComponent(icsText(list));
function gcalUrl(ds){const items=dayItems(ds),d=ds.replace(/-/g,""),nd=dStr(new Date(dParse(ds).getTime()+864e5)).replace(/-/g,"");
  let det=dayText(ds);if(det.length>1400)det=det.slice(0,1400)+"…";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Japonsko: "+dayCities(ds).map(k=>cityOf(k).name).join(" + "))+"&dates="+d+"/"+nd+"&details="+encodeURIComponent(det)}

  const ar=e.target.closest("[data-addroute]");if(ar){const r=allRoutes().find(x=>x.id===ar.dataset.addroute);const n=addToDay(S.day,orderOf(r));toast(n?`Pridaných ${n} ${miest(n)} na ${fmtDay(S.day)}`:"Táto trasa už v tom dni je");renderPlan();window.scrollTo({top:0,behavior:"smooth"});return}
  if(e.target.closest("[data-sorttime]")){const it=dayItems(S.day);PLAN.days[S.day]=[...it.filter(x=>x.time).sort((a,b)=>a.time.localeCompare(b.time)),...it.filter(x=>!x.time)];savePlan();renderPlan();return}
  const fd=e.target.closest("[data-food]");if(fd){const re=new RegExp(fd.dataset.food,"i");S.fq={q:fd.dataset.food,n:fd.dataset.fname};S.q="";S.area=null;S.cat=null;S.mustOnly=false;S.mine=false;S.tips=false;S.here=null;
    const cnt={};DATA.places.forEach(p=>{if(re.test(p.name+" "+p.note+" "+(p.gcat||"")))cnt[p.city]=(cnt[p.city]||0)+1});const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];if(best&&!cnt[S.city])S.city=best;renderCities();setTab("tipy");return}
  const rs=e.target.closest("[data-reset]");if(rs){try{localStorage.removeItem("jp.order."+rs.dataset.reset)}catch(_){};rerenderRoute(rs.dataset.reset);return}
  const w=e.target.closest("[data-want]"),d=e.target.closest("[data-done]"),r=e.target.closest("[data-route]"),g=e.target.closest("[data-goto]");
  if(w){const id=w.dataset.want;S.want.has(id)?S.want.delete(id):S.want.add(id);store.set("want",[...S.want]);w.setAttribute("aria-pressed",S.want.has(id));stats();toast(S.want.has(id)?"Pridané do ⭐ Moje":"Odobrané z ⭐ Moje")}
  if(d){const id=d.dataset.done;S.done.has(id)?S.done.delete(id):S.done.add(id);store.set("done",[...S.done]);d.setAttribute("aria-pressed",S.done.has(id));d.closest(".card").classList.toggle("isdone",S.done.has(id));stats()}
  if(r){const rt=allRoutes().find(x=>x.id===r.dataset.route);S.city=rt.city;renderCities();setTab("trasy");const el=$("#r-"+rt.id);el&&el.scrollIntoView({block:"start"})}
  if(g){const p=byId[g.dataset.goto];S.city=p.city;S.area=null;S.cat=null;S.q="";S.mustOnly=false;S.mine=false;renderCities();setTab("tipy");const el=$("#p-"+p.id);if(el){el.scrollIntoView({block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600)}}
});

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.__bip=e;if(S.tab==="info")renderInfo()});

if(!DATA.cities.some(c=>c.id===S.city))S.city=DATA.cities[0].id;
if(!["tipy","trasy","plan","mapa","info"].includes(S.tab))S.tab="tipy";
try{if(window.claude&&location.protocol!=="file:"&&!/github\.io|pages\.dev/.test(location.host))document.body.classList.add("noics")}catch(e){}
renderCities();setTab(S.tab);
if(!store.get("name","")&&!store.get("asked",false))askName();

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

</script>
