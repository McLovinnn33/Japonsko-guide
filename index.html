<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japonsko guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Figtree:wght@400;500;600;700;800&display=swap">
<meta name="theme-color" content="#d7263d">
<meta name="description" content="Moje tipy z Japonska s linkami do Google Maps.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>:root{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}
/* Layout: jedna mobilna appka, spodna navigacia ako vo vlaku; trasy kreslene ako linky metra, miesta maju "stanicne kody" (SH-03) */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1b1d22; --muted:#6a6e78; --line:#e2dfd7;
  --red:#d7263d; --red-soft:#fbe4e6; --chip:#eceae3; --gold:#b8860b;
  --tokyo:#2f9e44; --kyoto:#7b4fd6; --osaka:#e8590c; --nara:#1c7ed6; --kamakura:#0b8a8a;
  --shadow:0 1px 2px rgba(27,29,34,.06),0 4px 14px rgba(27,29,34,.06);
  --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121317; --surface:#1c1e24; --ink:#eceae4; --muted:#9a9ea8; --line:#2c2f37;
  --red:#ff5468; --red-soft:#3a1d22; --chip:#262931; --gold:#e0b343;
  --tokyo:#51cf66; --kyoto:#a98bff; --osaka:#ff922b; --nara:#4dabf7; --kamakura:#38d9a9;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121317; --surface:#1c1e24; --ink:#eceae4; --muted:#9a9ea8; --line:#2c2f37;
  --red:#ff5468; --red-soft:#3a1d22; --chip:#262931; --gold:#e0b343;
  --tokyo:#51cf66; --kyoto:#a98bff; --osaka:#ff922b; --nara:#4dabf7; --kamakura:#38d9a9;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

/* hlavicka */
.hero{padding-block:22px 6px;display:flex;flex-direction:column;gap:6px}
.hero .kanji{font-family:var(--display);color:var(--red);font-size:13px;letter-spacing:.3em}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1.05;margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}

/* mesta */
.cities{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.cities::-webkit-scrollbar{display:none}
.city{flex:0 0 auto;border:0;background:var(--chip);border-radius:999px;padding:8px 14px 8px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:14px}
.city .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:11px;background:var(--c)}
.city[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.city .n{font-weight:500;opacity:.6;font-size:12px}

/* filtre */
.filters{display:flex;flex-direction:column;gap:8px;padding-block:4px 12px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.area{border-left:4px solid var(--c)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink)}
.near{border:0;background:var(--red);color:#fff;border-radius:12px;padding:0 14px;font-weight:700;cursor:pointer;white-space:nowrap}

/* sekcie */
.areahead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.areahead .code{font-family:var(--display);color:#fff;background:var(--c);border-radius:6px;padding:2px 7px;font-size:13px}
.areahead h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.areahead .cnt{color:var(--muted);font-size:13px;margin-left:auto}
.list{display:flex;flex-direction:column;gap:10px}

/* karta miesta */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:80px}
.card.flash{outline:3px solid var(--red);outline-offset:2px}
.top{display:flex;gap:12px;align-items:flex-start}
.emo{flex:0 0 44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:22px}
.ttl{flex:1;min-width:0}
.ttl h3{margin:0;font-size:16.5px;line-height:1.25;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.st{font-family:var(--display);font-size:11px;color:var(--c);border:1.5px solid var(--c);border-radius:5px;padding:0 5px;line-height:17px}
.tag{background:var(--chip);border-radius:6px;padding:1px 7px;font-weight:600;color:var(--ink)}
.tag.must{background:var(--red);color:#fff}
.tag.gem{background:var(--gold);color:#fff}
.dist{font-weight:700;color:var(--red)}
.note{margin:0;font-size:15px;line-height:1.55;padding-left:12px;border-left:3px solid var(--line);max-width:65ch}
.route-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--c);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;text-decoration:none;border:0;cursor:pointer}
.btn.maps{flex:1;background:var(--ink);color:var(--bg)}
.btn.tog{background:var(--chip);min-width:46px}
.btn.tog[aria-pressed="true"].want{background:var(--gold);color:#fff}
.btn.tog[aria-pressed="true"].done{background:var(--tokyo);color:#fff}
.card.isdone{opacity:.62}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

/* trasy */
.routes{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.route{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.route header{display:flex;flex-direction:column;gap:4px}
.route .rt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.route .rt .line{font-family:var(--display);font-size:12px;color:#fff;background:var(--c);border-radius:999px;padding:2px 9px}
.route h3{margin:0;font-size:19px;font-weight:800;text-wrap:balance}
.route .why{margin:0;color:var(--muted);font-size:14px}
.stops{list-style:none;margin:0;padding:0;position:relative}
.stops li{position:relative;padding:0 0 14px 30px;min-height:28px}
.stops li::before{content:"";position:absolute;left:9px;top:12px;bottom:-4px;width:4px;background:var(--c)}
.stops li:last-child::before{display:none}
.stops li .bub{position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:4px solid var(--c)}
.stops button{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:700;font-size:15px}
.stops .sub{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.leg{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* mapa */
.mapbox{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;position:relative;touch-action:none;margin-top:6px}
.mapbox svg{display:block;width:100%;height:min(68vh,560px);cursor:grab}
.maphint{font-size:12.5px;color:var(--muted);margin:8px 2px}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
.sheet{margin-top:10px}

/* info */
.info{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.box{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.box h2{margin:0 0 10px;font-size:18px;font-weight:800}
.box ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.box li{display:flex;gap:10px}
.box li .i{flex:0 0 26px;font-size:18px;line-height:1.3}
.box li p{margin:0}
.box .by{font-size:12px;color:var(--muted)}
.install{background:var(--red);color:#fff}
.install h2{color:#fff}
.install ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.install li{display:list-item}
.install .btn{background:#fff;color:var(--red);margin-top:12px;width:100%}

/* spodna navigacia */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.tab .ic{font-size:20px;line-height:1.1;filter:grayscale(1);opacity:.75}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] .ic{filter:none;opacity:1}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

</div>

</nav></div>
<div class="toast" id="toast" hidden></div>

<script>

ty…", "offmap": false}, {"id": "465vxNWfFSXRF75z9", "name": "Miyashita Park", "city": "tokyo", "area": "SH", "cat": "park", "tags": ["den aj noc"], "note": "Vsade su skateri a mladi Japonci a je tam cool vibe cez den aj v noci.", "url": "https://maps.app.goo.gl/465vxNWfFSXRF75z9", "lat": 35.6617182, "lng": 139.7016472, "code": "SH-08", "short": "Vsade su skateri a mladi Japonci a je tam cool vibe cez den aj v noci.", "offmap": false}, {"id": "8YBkfNDKfuKoGVz47", "name": "Shibuya Parco", "city": "tokyo", "area": "SH", "cat": "shop", "tags": [], "note": "V tejto budove v Shibuyi (vsetko je nablizku toho, co posielam) je obrovske Pokemon Center aj Nintendo a je to jednoducho nieco, co sa hodi pozriet, ked uz ste v tom Japonsku. Celkovo si na nakupy treba idealne usetrit cas.", "url": "https://maps.app.goo.gl/8YBkfNDKfuKoGVz47", "lat": 35.6620484, "lng": 139.6987767, "code": "SH-09", "short": "V tejto budove v Shibuyi (vsetko je nablizku toho, co posielam) je obrovske Pokemon Center…", "offmap": false}, {"id": "Bn1Qz1gurXfQjKoB9", "name": "MEGA Don Quijote Shibuya", "city": "tokyo", "area": "SH", "cat": "shop", "tags": ["must", "24/7"], "note": "Kamo, sem musite ist, to je kde ides pesi od Shibuya Crossing. To je uplny bizar. Vola sa to Don Quijote alebo Donki a je to asi 8-poschodovy 24/7 obchod s doslovne vsetkym, co na svete existuje. Fakt haluz na stratenie, je to mrte slavne a toto je vazne ze povinnost. Mozno to vyznie divne, ze odporucam obycajny obchod, ale to pochopis, ked tam budes… Plus sa tam daju picovinky kupit hah. Som tam nechal asi 80 eur na sladkosti na Slovensko 😀", "url": "https://maps.app.goo.gl/Bn1Qz1gurXfQjKoB9", "lat": 35.6603873, "lng": 139.6978172, "code": "SH-10", "short": "Kamo, sem musite ist, to je kde ides pesi od Shibuya Crossing.", "offmap": false}, {"id": "GcAHeCSpyN9y7UHC9", "name": "Ikina Sushi Dokoro Abe Aoyama", "city": "tokyo", "area": "HJ", "cat": "sushi", "tags": ["premium"], "note": "Toto je uz taka sushi restika, co je viac premium.", "url": "https://maps.app.goo.gl/GcAHeCSpyN9y7UHC9", "lat": 35.6639296, "lng": 139.7089465, "code": "HJ-01", "short": "Toto je uz taka sushi restika, co je viac premium.", "offmap": false}, {"id": "VYxffERT2bAWgzLd8", "name": "Uobei Shibuya Dogenzaka", "city": "tokyo", "area": "SH", "cat": "sushi", "tags": ["belt"], "note": "Toto je dalsia sushi belt v Shibuyi. To minimalne raz treba absolvovat.", "url": "https://maps.app.goo.gl/VYxffERT2bAWgzLd8", "lat": 35.6594349, "lng": 139.6979207, "code": "SH-11", "short": "Toto je dalsia sushi belt v Shibuyi.", "offmap": false}, {"id": "nvFBvgqnr2ASRXwMA", "name": "Tsukiji Sushisei Shibuya", "city": "tokyo", "area": "SH", "cat": "sushi", "tags": [], "note": "Dalsie sushi, co som tusim bol, uz ani nepamatam 😀", "url": "https://maps.app.goo.gl/nvFBvgqnr2ASRXwMA", "lat": 35.6590658, "lng": 139.6989153, "code": "SH-12", "short": "Dalsie sushi, co som tusim bol, uz ani nepamatam 😀", "offmap": false}, {"id": "VjvDwwUyR3KHhmDW8", "name": "Sushizanmai Shibuya", "city": "tokyo", "area": "SH", "cat": "sushi", "tags": ["dobra cena"], "note": "Toto Sushizanmai je realne siet s viac prevadzkami, ale na toto som zobral aj chalanov, ked dosli pozriet… Fakt dobre sushi, fakt, a za prijatelnu cenu.", "url": "https://maps.app.goo.gl/VjvDwwUyR3KHhmDW8", "lat": 35.6592549, "lng": 139.6979579, "code": "SH-13", "short": "Toto Sushizanmai je realne siet s viac prevadzkami, ale na toto som zobral aj chalanov, ke…", "offmap": false}, {"id": "QrEeYTXkvuaAovpm7", "name": "Rokuetei Hitsumabushi", "city": "tokyo", "area": "SH", "cat": "food", "tags": [], "note": "Toto v Shibuyi… tie japonske steaky na ryzi su neuveritelne.", "url": "https://maps.app.goo.gl/QrEeYTXkvuaAovpm7", "lat": 35.658168, "lng": 139.6986262, "code": "SH-14", "short": "Toto v Shibuyi…", "offmap": false}, {"id": "6y5hYLhqwnJG6sXC8", "name": "Shabu-shabu On-yasai Shibuya", "city": "tokyo", "area": "SH", "cat": "food", "tags": ["all you can eat"], "note": "Toto je v Shibuyi take jedlo, co sa vola shabu shabu… je to japonska verzia hotpotu z Ciny. Sem som zobral celu partiu… je to pecka. Stoji to nejak 4000–8000 jenov, cize lacne, a je to all you can eat na hodinu, s priplatkom aj wagyu all you can eat. Toto bolo mega dobre, to odporucam… ak nie tuto konkretnu restiku, tak skusit niekde shabu shabu.", "url": "https://maps.app.goo.gl/6y5hYLhqwnJG6sXC8", "lat": 35.6613536, "lng": 139.7010709, "code": "SH-15", "short": "Toto je v Shibuyi take jedlo, co sa vola shabu shabu…", "offmap": false}, {"id": "RwjHJx6KoTA7uzFV7", "name": "Harajuku", "city": "tokyo", "area": "HJ", "cat": "area", "tags": ["must", "pol dna+"], "note": "Zo Shibuye sa da prejst pesi az sem. Je to Harajuku a tu fakt odporucam dat si aspon minimalne pol dna na prechadzanie a cekovanie obchodov. Je tam milion super 2nd hand dealov a nalozene vintage obchody, fakt je to tam vsetko mega pekne. Za mna realne najlepsia cast Tokya. Ked tam bol Kanye, tak sem chodil, aj ho tam videli.", "url": "https://maps.app.goo.gl/RwjHJx6KoTA7uzFV7", "lat": 35.6699682, "lng": 139.709008, "code": "HJ-02", "short": "Zo Shibuye sa da prejst pesi az sem.", "offmap": false}, {"id": "SizrMVkYwKaH1h2e8", "name": "Harajuku Station", "city": "tokyo", "area": "HJ", "cat": "transit", "tags": [], "note": "Na Harajuku som vacsinou chodil pesi, ale da sa dojst aj tusim 2 zastavky na tuto stanicu.", "url": "https://maps.app.goo.gl/SizrMVkYwKaH1h2e8", "lat": 35.6700901, "lng": 139.7024662, "code": "HJ-03", "short": "Na Harajuku som vacsinou chodil pesi, ale da sa dojst aj tusim 2 zastavky na tuto stanicu.", "offmap": false}, {"id": "54CMtuSCbrA7nk9D6", "name": "Meiji Jingu", "city": "tokyo", "area": "HJ", "cat": "temple", "tags": ["must"], "note": "A hned za nou je park a Meiji Jingu shrine, kde by ste sa urcite mali ist pozriet. Je tam taky chram, pekne miesto na ceremonialy… niekedy aj svadba… Mega stary strom v chrame a tam sa robi taka vec, ze napises svoje priania na take drievko a zavesis to tam… je to taka cool cinnost.", "url": "https://maps.app.goo.gl/54CMtuSCbrA7nk9D6", "lat": 35.6763976, "lng": 139.6993259, "code": "HJ-04", "short": "A hned za nou je park a Meiji Jingu shrine, kde by ste sa urcite mali ist pozriet.", "offmap": false}, {"id": "w7VUu4ZUG62ssiVe8", "name": "Tokyu Plaza Harajuku „Harakado\"", "city": "tokyo", "area": "HJ", "cat": "landmark", "tags": [], "note": "Po ceste do Harajuku sa ide vacsinou okolo tejto budovy. To je iba tip ako pekna budova.", "url": "https://maps.app.goo.gl/w7VUu4ZUG62ssiVe8", "lat": 35.6684259, "lng": 139.7049858, "code": "HJ-05", "short": "Po ceste do Harajuku sa ide vacsinou okolo tejto budovy.", "offmap": false}, {"id": "CL2Euch5Nj496RyW9", "name": "Liberty Walk Tokyo", "city": "tokyo", "area": "HJ", "cat": "cars", "tags": ["merch"], "note": "V Harajuku je tento shop. Tu som si kupil tricko, mikinu a pod… Je to jedna, asi najznamejsia tokijska tunerska firma a maju taky merch shop a vyzera to super, vzdy tam vidis nejake nalozene auto a podobne. Je to cool vidiet subkultury v Tokyu a vsade poblizku su same nalozene obchody, fakt tak originalne veci a produkty a obchodiky, ze sa z toho clovek zblazni.", "url": "https://maps.app.goo.gl/CL2Euch5Nj496RyW9", "lat": 35.6694863, "lng": 139.7082341, "code": "HJ-06", "short": "V Harajuku je tento shop.", "offmap": false}, {"id": "rT2arH1WcXHxzgd8A", "name": "Rizlabo Kitchen", "city": "tokyo", "area": "HJ", "cat": "sweet", "tags": [], "note": "V Harajuku je aj tato restika na japonske palacinky. Tych je viac, takze treba sa aj pozerat, co je ponuka na ulici… V Japonsku sa naozaj bez obav da fungovat tak, ze clovek vidi plagat alebo obrazok a moze ist do tej restiky… neni sanca sa ojebat… Neni to ako u nas na Slovensku, kde bez kontroly Google Maps by som tam nevkrocil.", "url": "https://maps.app.goo.gl/rT2arH1WcXHxzgd8A", "lat": 35.6685791, "lng": 139.7108039, "code": "HJ-07", "short": "V Harajuku je aj tato restika na japonske palacinky.", "offmap": false}, {"id": "6RRpVyTx1H6cbzK5A", "name": "Omoide Yokocho", "city": "tokyo", "area": "SJ", "cat": "bar", "tags": ["must", "vecer"], "note": "Toto je asi najznamejsia ta ulicka yokocho… je to tam fakt pekne, fotogenicke, mozno drahe kvoli turistom, ale to je tiez uplna povinnost, je to jedna z najhlavnejsich veci, co vidiet.", "url": "https://maps.app.goo.gl/6RRpVyTx1H6cbzK5A", "lat": 35.6927037, "lng": 139.6995778, "code": "SJ-01", "short": "Toto je asi najznamejsia ta ulicka yokocho…", "offmap": false}, {"id": "PeX7GiENsAJ64Bru7", "name": "Tokyu Kabukicho Tower", "city": "tokyo", "area": "SJ", "cat": "fun", "tags": ["must", "vecer"], "note": "Toto je budova na Kabukicho namesti. Tu som travil kazdy den… byval som v Shinjuku. Toto namestie, hlavne tam musite ist vecer. Je to najvacsi bizar, aky sa da. Ti ludia, ti ozrani… ten chaos… vsetko uplna haluz. Vsade su herne a bowlingy a sipky nonstop a v tom Kabukicho Tower vnutri je to sialene osvetlene a milion mini barov a sem musite ist, vazne ze URCITE.", "url": "https://maps.app.goo.gl/PeX7GiENsAJ64Bru7", "lat": 35.6957513, "lng": 139.7005894, "code": "SJ-02", "short": "Toto je budova na Kabukicho namesti.", "offmap": false}, {"id": "Jh4JTpKiHhJfcVxq7", "name": "Kamukura Ramen Shinjuku", "city": "tokyo", "area": "SJ", "cat": "food", "tags": [], "note": "Toto je ramen, ktory som mal strasne rad a po posilke som vzdy isiel, ale popravde neviem, ci to kazdemu sadne rovnako.", "url": "https://maps.app.goo.gl/Jh4JTpKiHhJfcVxq7", "lat": 35.6943956, "lng": 139.70208, "code": "SJ-03", "short": "Toto je ramen, ktory som mal strasne rad a po posilke som vzdy isiel, ale popravde neviem,…", "offmap": false}, {"id": "VrUciSwQLFLWkQHw8", "name": "Shinjuku Golden Gai", "city": "tokyo", "area": "SJ", "cat": "bar", "tags": ["must", "vecer"], "note": "Golden Gai je taka asi 100+ rokov stara yokocho s barmi a vsetko je to take ruin vibe. Ale tam sa plati casto aj 1500 jenov za sedenie ako fee, lebo tam je tak malo miesta… Kazdopadne cool zazitok… jedna z hlavnych function km(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function fmtKm(d){return d<1?Math.round(d*1000/10)*10+" m":(d<10?d.toFixed(1):Math.round(d))+" km"}
function walk(d){const m=Math.round(d*1000/75);return m<=1?"hneď vedľa":m<=25?`~${m} min pešo`:"radšej metrom"}

/* ---------- google maps linky ---------- */
function dirUrl(stops){
  const pts=stops.map(id=>byId[id]).filter(Boolean);
  if(pts.length<2) return pts[0]?pts[0].url:"#";
  const ll=p=>`${p.lat},${p.lng}`;
  const o=ll(pts[0]), d=ll(pts[pts.length-1]);
  const w=pts.slice(1,-1).map(ll).join("|");
  const far = pts.some((p,i)=>i&&km(pts[i-1],p)>2.5);
  return `https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${d}${w?"&waypoints="+encodeURIComponent(w):""}&travelmode=${far?"transit":"walking"}`;
}

/* ---------- mesta ---------- */
function renderCities(){
  const el=$("#cities");
  el.innerHTML=DATA.cities.map(c=>{
    const n=DATA.places.filter(p=>p.city===c.id).length;
    return `<button class="city" style="--c:var(--${c.id})" data-city="${c.id}" aria-pressed="${S.city===c.id}"><span class="dot">${c.kanji[0]}</span>${esc(c.name)}<span class="n">${n}</span></button>`
  }).join("");
  el.onclick=e=>{const b=e.target.closest(".city");if(!b)return;S.city=b.dataset.city;S.area=null;S.here=null;store.set("city",S.city);renderCities();render();window.scrollTo({top:0})};
}

function stats(){
  const all=DATA.places.length;
  $("#stats").innerHTML=`<span><b>${all}</b> miest</span><span><b>${DATA.routes.length}</b> trás</span><span>⭐ <b>${S.want.size}</b> chcem ísť</span><span>✅ <b>${S.done.size}</b> navštívené</span>`;
}

/* ---------- TIPY ---------- */
function filtered(){
  const q=S.q.trim().toLowerCase();
  let list=DATA.places.filter(p=>p.city===S.city);
  if(S.area) list=list.filter(p=>p.area===S.area);
  if(S.cat) list=list.filter(p=>p.cat===S.cat);
  if(S.mustOnly) list=list.filter(p=>p.tags.some(t=>t==="must"||t==="hidden gem"));
  if(S.mine) list=list.filter(p=>S.want.has(p.id));
  if(q) list=list.filter(p=>(p.name+" "+p.note+" "+p.tags.join(" ")+" "+CATS[p.cat][1]).toLowerCase().includes(q));
  return list;
}
function card(p){
  const a=areaOf(p.area), c=cityOf(p.city), [emo,label]=CATS[p.cat];
  const tags=p.tags.map(t=>`<span class="tag ${t==="must"?"must":t==="hidden gem"?"gem":""}">${t==="must"?"MUST":esc(t)}</span>`).join("");
  const rs=routesOf(p.id).map(r=>`<button class="route-link" data-route="${r.id}">🚃 Súčasť trasy: ${esc(r.title)} →</button>`).join("");
  const dist=S.here?`<span class="dist">${fmtKm(km(S.here,p))}</span>`:"";
  const w=S.want.has(p.id), d=S.done.has(p.id);
  return `<article class="card${d?" isdone":""}" id="p-${p.id}" style="--c:var(--${p.city})">
    <div class="top"><div class="emo" aria-hidden="true">${emo}</div>
      <div class="ttl"><h3>${esc(p.name)}</h3>
        <div class="meta"><span class="st">${p.code}</span><span>${esc(a.name)} · ${label}</span>${dist}${tags}</div></div></div>
    <p class="note">${esc(p.note)}</p>
    ${rs}
    <div class="actions">
      <a class="btn maps" href="${esc(p.url)}" target="_blank" rel="noopener">📍 Otvoriť v Google Maps</a>
      <button class="btn tog want" data-want="${p.id}" aria-pressed="${w}" aria-label="Chcem ísť">⭐</button>
      <button class="btn tog done" data-done="${p.id}" aria-pressed="${d}" aria-label="Bol som tam">✅</button>
    </div></article>`;
}
function renderTipy(){
  const city=cityOf(S.city);
  const areas=[...new Set(DATA.places.filter(p=>p.city===S.city).map(p=>p.area))];
  const cats=[...new Set(DATA.places.filter(p=>p.city===S.city).map(p=>p.cat))];
  let list=filtered();
  if(S.here) list=[...list].sort((a,b)=>km(S.here,a)-km(S.here,b));
  let body="";
  if(!list.length) body=`<div class="empty">Nič také tu nie je. Skús zrušiť filter.</div>`;
  else if(S.here) body=`<div class="areahead"><h2>Najbližšie k tebe</h2><span class="cnt">${list.length}</span></div><div class="list">${list.map(card).join("")}</div>`;
  else body=areas.filter(a=>list.some(p=>p.area===a)).map(a=>{
      const ps=list.filter(p=>p.area===a), ar=areaOf(a);
      return `<section><div class="areahead" style="--c:var(--${S.city})"><span class="code">${a}</span><h2>${esc(ar.name)}</h2><span class="cnt">${ps.length}</span></div>
      ${ar.note?`<p class="note" style="margin:-4px 0 10px">${esc(ar.note)}</p>`:""}
      <div class="list">${ps.map(card).join("")}</div></section>`}).join("");
  $("#view").innerHTML=`
  <div class="filters">
    <div class="search"><input id="q" type="search" placeholder="Hľadať: ramen, rooftop, zadarmo…" value="${esc(S.q)}" aria-label="Hľadať">
      <button class="near" id="near">${S.here?"✕ Zrušiť":"📍 Pri mne"}</button></div>
    <div class="row" id="areas">${areas.map(a=>`<button class="chip area" style="--c:var(--${S.city})" data-area="${a}" aria-pressed="${S.area===a}">${esc(areaOf(a).name)}</button>`).join("")}</div>
    <div class="row" id="cats">
      <button class="chip" data-must aria-pressed="${S.mustOnly}">🔥 Must &amp; gems</button>
      <button class="chip" data-mine aria-pressed="${S.mine}">⭐ Moje</button>
      ${cats.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${S.cat===c}">${CATS[c][0]} ${CATS[c][1]}</button>`).join("")}</div>
  </div>${body}`;
  const q=$("#q");
  q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;renderTipy();const n=$("#q");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
  $("#areas").onclick=e=>{const b=e.target.closest("[data-area]");if(!b)return;S.area=S.area===b.dataset.area?null:b.dataset.area;renderTipy()};
  $("#cats").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-must"))S.mustOnly=!S.mustOnly;else if(b.hasAttribute("data-mine"))S.mine=!S.mine;else S.cat=S.cat===b.dataset.cat?null:b.dataset.cat;renderTipy()};
  $("#near").onclick=nearMe;
}
function nearMe(){
  if(S.here){S.here=null;renderTipy();return}
  if(!navigator.geolocation){toast("Poloha tu nie je dostupná, vyber si štvrť hore.");return}
  toast("Zisťujem polohu…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const here={lat:pos.coords.latitude,lng:pos.coords.longitude};
    const near=DATA.cities.map(c=>({c,d:Math.min(...DATA.places.filter(p=>p.city===c.id).map(p=>km(here,p)))})).sort((a,b)=>a.d-b.d)[0];
    if(near.d>60){toast("Si ďaleko od Japonska 🙂 Vyber si štvrť hore.");return}
    S.here=here;S.city=near.c.id;S.area=null;renderCities();setTab("tipy");toast("Zoradené podľa vzdialenosti");
  },()=>toast("Polohu sa nepodarilo zistiť. Vyber si štvrť hore."),{enableHighAccuracy:true,timeout:9000,maximumAge:60000});
}

/* ---------- TRASY ---------- */
function renderTrasy(){
  const rs=DATA.routes.filter(r=>r.city===S.city);
  $("#view").innerHTML=`<div class="routes">${rs.length?rs.map(r=>{
    const stops=r.stops.map(id=>byId[id]);
    return `<article class="route" id="r-${r.id}" style="--c:var(--${r.city})"><header>
      <div class="rt"><span class="line">${esc(r.badge)}</span><span class="by" style="font-size:12.5px;color:var(--muted)">${esc(r.time)}</span></div>
      <h3>${esc(r.title)}</h3><p class="why">${esc(r.why)}</p></header>
      <ol class="stops">${stops.map((p,i)=>`<li><span class="bub"></span><button data-goto="${p.id}">${CATS[p.cat][0]} ${esc(p.name)}<span class="sub">${esc(p.short)}</span></button>${i<stops.length-1?`<span class="leg">↓ ${walk(km(p,stops[i+1]))} · ${fmtKm(km(p,stops[i+1]))}</span>`:""}</li>`).join("")}</ol>
      <a class="btn maps" href="${dirUrl(r.stops)}" target="_blank" rel="noopener">${r.stops.length>1?"🧭 Navigovať celú trasu v Google Maps":"📍 Otvoriť v Google Maps"}</a>
    </article>`}).join(""):`<div class="empty">Pre toto mesto zatiaľ nemám trasu, pozri Tipy.</div>`}</div>`;
}

/* ---------- MAPA (vlastna, bez nacitavania dlazdic = rychle aj na datach) ---------- */
let mapState=null;
function renderMapa(){
  const ps=DATA.places.filter(p=>p.city===S.city && !p.offmap);
  const lat0=ps.reduce((s,p)=>s+p.lat,0)/ps.length, k=Math.cos(lat0*Math.PI/180);
  const X=p=>p.lng*k*1000, Y=p=>-p.lat*1000;
  const xs=ps.map(X), ys=ps.map(Y);
  const pad=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))*0.08+1.2;
  const vb=[Math.min(...xs)-pad,Math.min(...ys)-pad,Math.max(...xs)-Math.min(...xs)+2*pad,Math.max(...ys)-Math.min(...ys)+2*pad];
  const span=Math.max(vb[2],vb[3]);
  const r=span/90;
  const areas=[...new Set(ps.map(p=>p.area))];
  const labels=areas.map(a=>{const q=ps.filter(p=>p.area===a);const cx=q.reduce((s,p)=>s+X(p),0)/q.length,cy=Math.min(...q.map(Y));
    return `<text x="${cx}" y="${cy-r*3}" text-anchor="middle" class="al" style="font-size:${r*2.6}px">${esc(areaOf(a).name)}</text>`}).join("");
  const routes=DATA.routes.filter(x=>x.city===S.city).map(x=>{const pts=x.stops.map(id=>byId[id]).filter(p=>p&&!p.offmap);
    return `<polyline points="${pts.map(p=>X(p)+","+Y(p)).join(" ")}" fill="none" stroke="var(--${S.city})" stroke-opacity=".35" stroke-width="${r*0.9}" stroke-linecap="round" stroke-linejoin="round"/>`}).join("");
  const dots=ps.map(p=>`<g class="pin" data-pin="${p.id}" transform="translate(${X(p)},${Y(p)})"><circle r="${r*1.55}" fill="var(--surface)" stroke="${p.tags.includes("must")?"var(--red)":"var(--"+S.city+")"}" stroke-width="${r*0.35}"/><text text-anchor="middle" dy="${r*0.55}" style="font-size:${r*1.5}px">${CATS[p.cat][0]}</text></g>`).join("");
  const off=DATA.places.filter(p=>p.city===S.city&&p.offmap);
  $("#view").innerHTML=`<div class="mapbox" id="mapbox">
    <svg id="svg" viewBox="${vb.join(" ")}" role="img" aria-label="Mapa tipov">
      <style>.al{fill:var(--muted);font-family:var(--display);opacity:.8}.pin{cursor:pointer}</style>
      <rect x="${vb[0]-span}" y="${vb[1]-span}" width="${vb[2]+2*span}" height="${vb[3]+2*span}" fill="var(--surface)"/>
      ${routes}${labels}${dots}
    </svg>
    <div class="zoom"><button id="zin" aria-label="Priblížiť">+</button><button id="zout" aria-label="Oddialiť">−</button></div>
  </div>
  <p class="maphint">Ťukni na bod a uvidíš môj tip. Mapu môžeš posúvať a zväčšovať. Čiary sú trasy, červený okraj = must.${off.length?` Mimo mapy: ${off.map(p=>esc(p.name)).join(", ")}.`:""}</p>
  <div class="sheet" id="sheet"></div>`;
  const svg=$("#svg");
  mapState={vb:[...vb],base:[...vb]};
  const apply=()=>svg.setAttribute("viewBox",mapState.vb.join(" "));
  const zoom=(f,cx,cy)=>{const v=mapState.vb;cx=cx??v[0]+v[2]/2;cy=cy??v[1]+v[3]/2;
    const nw=Math.min(Math.max(v[2]*f,mapState.base[2]/14),mapState.base[2]*1.5),nh=nw*v[3]/v[2];
    mapState.vb=[cx-(cx-v[0])*nw/v[2],cy-(cy-v[1])*nh/v[3],nw,nh];apply()};
  $("#zin").onclick=()=>zoom(.6);$("#zout").onclick=()=>zoom(1/.6);
  const toSvg=(x,y)=>{const b=svg.getBoundingClientRect(),v=mapState.vb,s=Math.max(v[2]/b.width,v[3]/b.height);
    return [v[0]+(x-b.left)*s-(b.width*s-v[2])/2, v[1]+(y-b.top)*s-(b.height*s-v[3])/2, s]};
  const ptrs=new Map();let last=null,moved=0;
  svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;last=null});
  svg.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){const [,,s]=toSvg(0,0);mapState.vb[0]-=(e.clientX-prev.x)*s;mapState.vb[1]-=(e.clientY-prev.y)*s;moved+=Math.abs(e.clientX-prev.x)+Math.abs(e.clientY-prev.y);apply()}
    else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(last){const [cx,cy]=toSvg((a.x+b.x)/2,(a.y+b.y)/2);zoom(last/d,cx,cy)}last=d;moved+=10}});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)last=null};
  svg.addEventListener("pointerup",e=>{up(e);if(moved<8){const g=e.target.closest&&e.target.closest("[data-pin]");if(g)showSheet(g.dataset.pin)}});
  svg.addEventListener("pointercancel",up);
  svg.addEventListener("wheel",e=>{e.preventDefault();const [cx,cy]=toSvg(e.clientX,e.clientY);zoom(e.deltaY>0?1.15:1/1.15,cx,cy)},{passive:false});
}
function showSheet(id){$("#sheet").innerHTML=card(byId[id]);$("#sheet").scrollIntoView({behavior:"smooth",block:"nearest"})}

/* ---------- INFO ---------- */
function renderInfo(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent), android=/android/i.test(navigator.userAgent);
  const steps=ios?["Otvor tento link v <b>Safari</b>.","Ťukni na <b>Zdieľať</b> (štvorček so šípkou).","Vyber <b>Pridať na plochu</b> a potvrď."]
    :["Otvor tento link v <b>Chrome</b>.","Ťukni na <b>⋮</b> vpravo hore.","Vyber <b>Pridať na plochu</b> / <b>Inštalovať aplikáciu</b>."];
  $("#view").innerHTML=`<div class="info">
    <section class="box install"><h2>📲 Daj si to na plochu</h2>
      <ol>${steps.map(s=>`<li>${s}</li>`).join("")}</ol>
      <button class="btn" id="inst" ${window.__bip?"":"hidden"}>Pridať na plochu jedným ťuknutím</button>
      <p style="margin:10px 0 0;font-size:13px;opacity:.9">Hviezdičky ⭐ a fajky ✅ sa ukladajú len v tvojom telefóne.</p></section>
    <section class="box"><h2>🇯🇵 Moje rady</h2><ul>${DATA.tips.mine.map(t=>`<li><span class="i">${t.i}</span><p>${esc(t.t)}</p></li>`).join("")}</ul></section>
    <section class="box"><h2>🧹 Vynulovať</h2><p style="margin:0 0 10px;color:var(--muted)">Zmaže tvoje hviezdičky a fajky v tomto telefóne.</p>
      <button class="chip" id="reset">Vymazať ⭐ a ✅</button> <span id="resetq" hidden>Naozaj? <button class="chip" id="resety">Áno, vymazať</button></span></section>
  </div>`;
  const ib=$("#inst");if(ib)ib.onclick=async()=>{const p=window.__bip;if(!p)return;p.prompt();await p.userChoice;window.__bip=null;ib.hidden=true};
  $("#reset").onclick=()=>$("#resetq").hidden=false;
  $("#resety").onclick=()=>{S.want.clear();S.done.clear();store.set("want",[]);store.set("done",[]);stats();toast("Vymazané");$("#resetq").hidden=true};
}

/* ---------- prepinanie ---------- */
function setTab(t){S.tab=t;store.set("tab",t);document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));render();window.scrollTo({top:0})}
function render(){stats();({tipy:renderTipy,trasy:renderTrasy,mapa:renderMapa,info:renderInfo})[S.tab]()}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest(".tab");if(b)setTab(b.dataset.tab)};

/* klik na hviezdicku, fajku, trasu, zastavku */
document.addEventListener("click",e=>{
  const w=e.target.closest("[data-want]"),d=e.target.closest("[data-done]"),r=e.target.closest("[data-route]"),g=e.target.closest("[data-goto]");
  if(w){const id=w.dataset.want;S.want.has(id)?S.want.delete(id):S.want.add(id);store.set("want",[...S.want]);w.setAttribute("aria-pressed",S.want.has(id));stats();toast(S.want.has(id)?"Pridané do ⭐ Moje":"Odobrané z ⭐ Moje")}
  if(d){const id=d.dataset.done;S.done.has(id)?S.done.delete(id):S.done.add(id);store.set("done",[...S.done]);d.setAttribute("aria-pressed",S.done.has(id));d.closest(".card").classList.toggle("isdone",S.done.has(id));stats()}
  if(r){const rt=DATA.routes.find(x=>x.id===r.dataset.route);S.city=rt.city;renderCities();setTab("trasy");const el=$("#r-"+rt.id);el&&el.scrollIntoView({block:"start"})}
  if(g){const p=byId[g.dataset.goto];S.city=p.city;S.area=null;S.cat=null;S.q="";S.mustOnly=false;S.mine=false;renderCities();setTab("tipy");const el=$("#p-"+p.id);if(el){el.scrollIntoView({block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600)}}
});

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.__bip=e;if(S.tab==="info")renderInfo()});

if(!DATA.cities.some(c=>c.id===S.city))S.city=DATA.cities[0].id;
if(!["tipy","trasy","mapa","info"].includes(S.tab))S.tab="tipy";
renderCities();setTab(S.tab);

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

</script>
